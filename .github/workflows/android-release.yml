name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix (e.g. 1.0.0), released as android-v<version>"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        working-directory: .
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#android-v}"
          else
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "ERROR: '$VERSION' is not a valid version (expected e.g. 1.2.3)."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v${VERSION}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Signing is optional: without ANDROID_KEYSTORE_BASE64 the release APK is built
      # unsigned (the AAB is unsigned too), and the release notes say so.
      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: .
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret, building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        env:
          TQ_ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          TQ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TQ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TQ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="$VERSION" \
            -PversionCode="${{ github.run_number }}"

      - name: Package artifacts
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -e
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/ThoughtQueue-${VERSION}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/ThoughtQueue-${VERSION}-unsigned.apk"
          fi
          cp app/build/outputs/bundle/release/app-release.aab "dist/ThoughtQueue-${VERSION}.aab"
          cd dist
          sha256sum ./* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Compose release notes header
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          {
            echo "**ThoughtQueue ${VERSION}** for Android 8.0+ (API 26)."
            echo
            echo "Install the APK directly, or upload the AAB to Play Console."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> This build is not signed with a release key, so the APK will not install until it is signed."
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ThoughtQueue Android ${{ env.VERSION }}
          body_path: android/release-notes.md
          generate_release_notes: true
          files: |
            android/dist/*

      - name: Clean up keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/release.jks"
